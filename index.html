<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Web MIDI Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <select id="midiOutputs">
      <option>Selecting MIDI Output...</option>
    </select>
    <div class="status" id="status">Connecting...</div>
    <button id="fullscreenBtn">⛶ Fullscreen</button>
  </div>

  <div class="pad-grid">
    <!-- C4 to G4 MIDI Note Numbers (60 to 67) -->
    <div class="pad" data-note="60">PAD 1</div>
    <div class="pad" data-note="61">PAD 2</div>
    <div class="pad" data-note="62">PAD 3</div>
    <div class="pad" data-note="63">PAD 4</div>
    <div class="pad" data-note="64">PAD 5</div>
    <div class="pad" data-note="65">PAD 6</div>
    <div class="pad" data-note="66">PAD 7</div>
    <div class="pad" data-note="67">PAD 8</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
